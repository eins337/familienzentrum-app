name: familienzentrum_app
description: "Familienzentrum Lank – App fürs Kita-Team, Eltern und Kinder."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  file_picker: ^8.1.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
